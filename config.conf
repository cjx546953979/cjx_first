# 桌面清理脚本配置文件
# Desktop Cleanup Script Configuration

# 清理目录列表（相对于桌面路径）
TEMP_DIRECTORIES=(
    "temp"
    "tmp" 
    "临时文件"
    "临时"
    "cache"
    "废纸篓"
)

# 清理文件扩展名
TEMP_FILE_EXTENSIONS=(
    "*.tmp"
    "*.temp"
    "*.cache"
    "*.log"
    "*.bak"
    "*.old"
    "*.swp"
    "*.DS_Store"
    "*~"
)

# 下载文件夹清理设置
CLEAN_DOWNLOADS=true
DOWNLOADS_RETENTION_DAYS=7

# 回收站清理设置
EMPTY_TRASH=true

# 日志设置
ENABLE_LOGGING=true
LOG_RETENTION_DAYS=30

# 安全设置
CONFIRM_BEFORE_DELETE=false
DRY_RUN=false